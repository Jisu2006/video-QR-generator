{% extends "base.html" %}

{% block title %}Admin Login - Video QR Generator{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 3rem auto 0;">
  <div class="glass-card" style="text-align: center; padding: 2.5rem 2rem;">

    <div class="brand-icon" style="width: 58px; height: 58px; font-size: 1.8rem; margin: 0 auto 1.25rem;">
      <i class="ri-lock-2-line"></i>
    </div>

    <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem;">
      Admin Access
    </h1>

    <p style="color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 2rem;">
      Sign in to manage videos, view analytics, and generate QR codes.
    </p>

    <form method="POST" action="{{ url_for('auth.login') }}" style="text-align: left;">

      <div class="form-group">
        <label class="form-label" for="username-input">
          <i class="ri-user-3-line"></i> Username
        </label>

        <input
          type="text"
          id="username-input"
          name="username"
          class="form-control"
          placeholder="Enter username"
          required
          autocomplete="username"
          autofocus
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password-input">
          <i class="ri-key-2-line"></i> Password
        </label>

        <input
          type="password"
          id="password-input"
          name="password"
          class="form-control"
          placeholder="Enter password"
          required
          autocomplete="current-password"
        >
      </div>

      <button
        type="submit"
        class="btn btn-primary"
        style="width: 100%; margin-top: 1rem;"
        id="login-submit-btn"
      >
        <i class="ri-login-box-line"></i>
        Sign In to Dashboard
      </button>

    </form>

  </div>
</div>
{% endblock %}
